<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%BA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='prefs.js') }}"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('views.home') }}">{{ site_name }}</a>
    {% if user %}
    <nav class="top-nav" aria-label="Settings">
      <div class="text-size" role="group" aria-label="Text size">
        <button type="button" class="size-btn size-1" data-size="normal" aria-label="Normal text size">A</button>
        <button type="button" class="size-btn size-2" data-size="large" aria-label="Larger text size">A</button>
        <button type="button" class="size-btn size-3" data-size="xlarge" aria-label="Largest text size">A</button>
      </div>
      {% if user.is_admin %}<a class="link-button" href="{{ url_for('admin.index') }}">Manage</a>{% endif %}
      <form method="post" action="{{ url_for('views.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="link-button">Sign out</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="alert alert-{{ category }}" role="status">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
