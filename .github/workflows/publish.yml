name: Publish

# Builds the Docker image for one release tag (vX.Y.Z) and pushes it to Docker Hub. Started by pushing
# a version tag, by hand from the Actions tab, or by auto-release.yml and scan.yml.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, such as v1.2.3. Leave empty for the newest release."
        type: string
        required: false

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  resolve:
    name: Pick the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      newest: ${{ steps.pick.outputs.newest }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WANTED: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          set -eu
          newest=$(gh api "repos/${REPO}/git/matching-refs/tags/v" --paginate --jq '.[].ref' \
            | sed 's|^refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          tag="${WANTED:-$newest}"
          if [ -z "$tag" ]; then
            echo "::error::There is no release tag (vX.Y.Z) to build yet."; exit 1
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$tag' is not a vX.Y.Z tag."; exit 1
          fi
          if ! gh api "repos/${REPO}/git/ref/tags/${tag}" --silent 2>/dev/null; then
            echo "::error::The tag $tag does not exist."; exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ "$tag" = "$newest" ]; then echo "newest=true" >> "$GITHUB_OUTPUT"; else echo "newest=false" >> "$GITHUB_OUTPUT"; fi

  verify:
    name: Verify
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ needs.resolve.outputs.tag }}

  publish:
    name: Build and push
    needs: [resolve, verify]
    # Forks and fresh copies without Docker Hub settings still get CI, but publish nothing.
    if: vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # to create the GitHub release
      id-token: write   # for keyless signing with Sigstore
    env:
      IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME }}/stories-and-videos
      TAG: ${{ needs.resolve.outputs.tag }}
      NEWEST: ${{ needs.resolve.outputs.newest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - id: source
        name: Note the exact commit being built
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # 1.2.3 always; 1.2, 1 and latest only when this is the newest release.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve.outputs.tag }},enable=${{ needs.resolve.outputs.newest == 'true' }}
            type=semver,pattern={{major}},value=${{ needs.resolve.outputs.tag }},enable=${{ needs.resolve.outputs.newest == 'true' }}
            type=raw,value=latest,enable=${{ needs.resolve.outputs.newest == 'true' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
      - id: build
        name: Build for amd64 and arm64, and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Update the Docker Hub page
        if: needs.resolve.outputs.newest == 'true'
        continue-on-error: true   # needs a token that may edit the page; the image is already published
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME }}/stories-and-videos
          short-description: A simple, large-print video library for family stories.
          readme-filepath: README.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The release $TAG already exists."; exit 0
          fi
          latest=--latest=false
          if [ "$NEWEST" = "true" ]; then latest=--latest; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" "$latest" \
            --generate-notes --notes "Docker image: \`${IMAGE}:${TAG#v}\`"

  scan:
    name: Scan
    needs: publish
    permissions:
      contents: read
      security-events: write
      actions: write
    uses: ./.github/workflows/scan.yml
